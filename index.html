}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111514; --surface:#191f1d; --ink:#e5eae7; --muted:#929e99; --line:#29322f;

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0;
  display:grid;grid-template-rows:auto 1fr;gap:10px;box-sizing:border-box;

*,*::before,*::after{box-sizing:inherit}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.code{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:clamp(20px,2.6vw,28px);line-height:1.05;margin:0;text-wrap:balance}
.hright{display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-width:0}
.lead{color:var(--muted);max-width:60ch;margin:0;font-size:13px}
main{display:grid;grid-template-columns:1fr minmax(340px,430px);gap:12px;min-height:0}
body.nopanel main{grid-template-columns:1fr}
body.nopanel aside{display:none}
.viewer{position:relative;border-radius:12px;overflow:hidden;background:var(--sky);border:1px solid var(--line);min-height:0;min-width:0}
#three{position:absolute;inset:0}
#three canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.bar{position:absolute;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none;z-index:2}
.bar>*{pointer-events:auto}
.bar.tl{left:12px;top:12px;right:130px}
.bar.tr{right:12px;top:12px}
.bar.bl{left:12px;bottom:12px;right:12px}
.seg{display:flex;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:8px;overflow:hidden;backdrop-filter:blur(6px)}
.seg button{font:inherit;font-size:12.5px;font-weight:500;border:0;background:transparent;color:var(--ink);padding:7px 11px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 12px;display:flex;align-items:center;gap:10px;font-size:12.5px;backdrop-filter:blur(6px)}
.pill input[type=range]{accent-color:var(--accent);width:130px}
.pill b{font-family:var(--f-mono);font-weight:500}
.hintp{color:var(--muted);font-size:11.5px}
#walkUI{position:absolute;inset:0;pointer-events:none;z-index:1}
.cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;opacity:.6}
.cross::before,.cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #0008}
.cross::before{left:6px;top:0;width:2px;height:14px}.cross::after{top:6px;left:0;height:2px;width:14px}
.walkbar{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:auto;max-width:96%}
.walkbar button{font:inherit;font-size:12.5px;font-weight:500;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);color:var(--ink);cursor:pointer}
#joy{position:absolute;left:18px;bottom:64px;width:110px;height:110px;border-radius:50%;border:2px solid #fff8;background:#0003;pointer-events:auto;touch-action:none;display:none}
#joy i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fffc}
@media (pointer:coarse){#joy{display:block}}
#toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
#toast.on{opacity:1}
aside{display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi .v{font-family:var(--f-display);font-stretch:110%;font-weight:700;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--f-body);font-size:11.5px;font-weight:500;color:var(--muted)}
.kpi .k{font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{font:inherit;font-size:13px;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:6px 10px 8px;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[role=tabpanel]{display:flex;flex-direction:column;gap:12px}
#plan{width:100%;display:block;touch-action:none;border-radius:8px;background:var(--bg)}
button.b{font:inherit;font-size:13px;font-weight:500;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 11px;cursor:pointer}
button.b:hover{border-color:var(--accent)}
button.b.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.b.dng{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);min-width:0}
input[type=text],input[type=number],select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-mono)}
input[type=color]{width:100%;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
input[type=range]{width:100%;accent-color:var(--accent)}
.oprow{display:grid;grid-template-columns:1.3fr 1fr;gap:5px;padding:6px 0;border-top:1px solid var(--line)}
.oprow .l2{grid-column:1/-1;display:grid;grid-template-columns:1fr 70px 32px;gap:6px;align-items:center}
.insp{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.insp h3{margin:0;font-size:14px;font-family:var(--f-display);font-stretch:108%}
.note{font-size:12px;color:var(--muted);margin:0}
.warn{font-size:12px;color:var(--danger);min-height:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:5px;border-bottom:1px solid var(--line)}
td{padding:5px;border-bottom:1px solid var(--line)}
td.a,th.a{text-align:right;font-family:var(--f-mono)}
tr.on td{background:color-mix(in srgb,var(--hl) 18%,transparent)}
tr.sum td{font-weight:600;border-bottom:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.list{display:flex;flex-direction:column;gap:2px}
.list button{display:flex;justify-content:space-between;text-align:left;font:inherit;font-size:13px;background:none;border:0;border-bottom:1px solid var(--line);padding:5px 2px;color:var(--ink);cursor:pointer}
.list button.on{background:color-mix(in srgb,var(--hl) 18%,transparent)}
.sgrp{display:flex;flex-direction:column;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.big{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:26px}
.bars{display:flex;flex-direction:column;gap:7px}
.brow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.brow .tr{grid-column:1/-1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.brow .fl{height:100%;background:var(--accent)}

@media (max-width:900px){

  main{grid-template-columns:1fr}
  .viewer{height:62vh;min-height:380px}
  aside{overflow:visible}
  .bar.tl{right:12px;top:52px}
  .hintp{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

 if(h.t==='resize'){const r=roomById(h.id);pdrag={m:'resize',id:h.id,x,z,o:{w:r.w,d:r.d}};return;}
 select(h.t==='stair'?{t:'stair'}:{t:h.t,id:h.id});
 if(h.t==='room'){const r=roomById(h.id);pdrag={m:'room',id:h.id,x,z,o:{x:r.x,z:r.z}};}
 else if(h.t==='furn'){const f=S.furn.find(q=>q.id===h.id);pdrag={m:'furn',id:h.id,x,z,o:{x:f.x,z:f.z}};}
 else pdrag={m:'stair',x,z,o:{x:S.stair.x,z:S.stair.z}};});
plan.addEventListener('pointermove',e=>{const [x,z]=pPos(e);
 if(!pdrag){const h=planHit(x,z);plan.style.cursor=!h?'default':h.t==='resize'?'nwse-resize':'move';return;}
 const dx=x-pdrag.x,dz=z-pdrag.z;
 if(pdrag.m==='room'){const r=roomById(pdrag.id);r.x=snap(pdrag.o.x+dx,SNAP);r.z=snap(pdrag.o.z+dz,SNAP);}
 else if(pdrag.m==='resize'){const r=roomById(pdrag.id);r.w=clamp(snap(pdrag.o.w+dx,SNAP),1.5,20);r.d=clamp(snap(pdrag.o.d+dz,SNAP),1.5,20);}
 else if(pdrag.m==='furn'){const f=S.furn.find(q=>q.id===pdrag.id);f.x=snap(pdrag.o.x+dx,.05);f.z=snap(pdrag.o.z+dz,.05);}
 else{S.stair.x=snap(pdrag.o.x+dx,.05);S.stair.z=snap(pdrag.o.z+dz,.05);}
 syncInspPos();queue(true);});
const pend=()=>{if(pdrag){const m=pdrag.m;pdrag=null;if(m==='furn')autoLv(S.furn.find(q=>q.id===sel.id));fitPlan();queue();}};
plan.addEventListener('pointerup',pend);plan.addEventListener('pointercancel',pend);
plan.addEventListener('pointerleave',()=>{if(!pdrag)plan.style.cursor='default';});
/* ---------- refresh / selection ---------- */
let dirty=false;
function queue(){if(dirty)return;dirty=true;requestAnimationFrame(()=>{dirty=false;refresh();});}
function refresh(){computeGeom();buildHouse();updateOverlays();drawPlan();renderKPIs();renderPanels();
 const o=overlaps();$('warn').textContent=o.length?t('wOver')+o.join('; '):'';adaptLevels();save();hist();}
function select(s){sel=s&&(s.t==='stair'||s.id)?s:null;
 if(sel&&sel.t==='room')planLv=roomLv(sel.id);else if(sel&&sel.t==='furn'){const f=S.furn.find(q=>q.id===sel.id);if(f)planLv=(f.lv===2||f.lv===4)?2:1;}
 press('planSeg',String(planLv));renderInsp();updateOverlays();drawPlan();renderPanels();}
function setHover(id){if(id===hover)return;hover=id;updateOverlays();drawPlan();}
const selRoom=()=>sel&&sel.t==='room'?roomById(sel.id):null;
const selFurn=()=>sel&&sel.t==='furn'?S.furn.find(f=>f.id===sel.id):null;
function syncInspPos(){const f=selFurn(),r=selRoom();const set=(k,v)=>{const e=document.querySelector('#insp [data-f="'+k+'"]');if(e&&document.activeElement!==e)e.value=v;};
 if(f){set('x',f.x);set('z',f.z);}else if(r){set('x',r.x);set('z',r.z);set('w',r.w);set('d',r.d);}else if(sel&&sel.t==='stair'){set('sx',S.stair.x);set('sz',S.stair.z);}}

/* ---------- inspector ---------- */
const optList=(arr,cur,lab)=>arr.map(v=>`<option value="${v}"${v===cur?' selected':''}>${esc(lab(v))}</option>`).join('');
const num=(f,v,step,min,max)=>`<input type="number" data-f="${f}" value="${v}" step="${step}"${min!=null?` min="${min}"`:''}${max!=null?` max="${max}"`:''}>`;
function renderInsp(){
 const box=$('insp'),r=selRoom(),f=selFurn();
 if(r){const ops=(r.ops||[]).map((o,i)=>`<div class="oprow" data-i="${i}">
  <select data-f="op.k">${optList(KINDS,o.k,k=>t('op_'+k))}</select><select data-f="op.s">${optList(['N','E','S','W'],o.s,k=>t('s'+k))}</select>
  <div class="l2"><input type="range" data-f="op.p" min="5" max="95" step="1" value="${Math.round(o.p*100)}" aria-label="${t('opPos')}">${num('op.w',(o.w!=null?o.w:DEF[o.k].w),.1,.5,6)}<button class="b dng" data-act="delop" data-i="${i}" aria-label="${t('del')}">×</button></div></div>`).join('');
  box.innerHTML=`<h3>${esc(rn(r))}</h3>
  <div class="g2"><label class="f">${t('rName')}<input type="text" data-f="n" value="${esc(rn(r))}"></label>
  <label class="f">${t('rType')}<select data-f="t">${optList(Object.keys(RT),r.t,k=>t('ty_'+k))}</select></label></div>
  <div class="g2"><label class="f">${t('rFin')}<select data-f="fin">${optList(FINS,r.fin,k=>t('fin_'+k))}</select></label>
  <label class="f">${t('rWall')}<input type="color" data-f="wall" value="${r.wall}"></label></div>
  <div class="g4"><label class="f">${t('rX')}${num('x',r.x,.25)}</label><label class="f">${t('rZ')}${num('z',r.z,.25)}</label><label class="f">${t('rW')}${num('w',r.w,.25,1.5,20)}</label><label class="f">${t('rD')}${num('d',r.d,.25,1.5,20)}</label></div>
  <p class="eyebrow">${t('rOps')}</p>${ops}
  <div class="row"><button class="b" data-act="addop" data-k="door">${t('addDoor')}</button><button class="b" data-act="addop" data-k="win">${t('addWin')}</button><button class="b" data-act="addop" data-k="glass">${t('addGlass')}</button></div>
  <div class="row"><button class="b" data-act="duproom">${t('dup')}</button><button class="b dng" data-act="delroom">${t('delRoom')}</button></div>`;
 }else if(f){const o=f.o||{};
  const fld=(k,lab,v,st,mn,mx)=>`<label class="f">${lab}${num('o.'+k,v,st,mn,mx)}</label>`;let ex='';
  if(['sofa','counter','wardrobe','shelf'].includes(f.k))ex+=fld('len',t('fLen'),o.len||FP(f.k,o)[0],.1,.5,6);
  if(['bed','table','desk','rug'].includes(f.k))ex+=fld('w',t('fW'),o.w||FP(f.k,o)[0],.1,.5,6);
  if(['table','rug'].includes(f.k))ex+=fld('d',t('fD'),o.d||(f.k==='rug'?2.2:.9),.1,.5,6);
  if(f.k==='bed')ex+=`<label class="f">${t('fColor')}<select data-f="o.c">${optList(['teal','red','blue','sand'],o.c||'teal',k=>t('c_'+k))}</select></label>`;
  if(f.k==='table')ex+=`<label class="chk"><input type="checkbox" data-f="o.chairs"${o.chairs?' checked':''}>${t('fChairs')}</label>`;
  const cat=CAT.find(c=>c[1]===f.k);
  box.innerHTML=`<h3>${esc(cat?t('c_'+cat[0]):f.k)}</h3><div class="g4"><label class="f">${t('rX')}${num('x',f.x,.05)}</label><label class="f">${t('rZ')}${num('z',f.z,.05)}</label></div>
  <div class="g2">${ex}</div><div class="row"><button class="b" data-act="rot">${t('rot')}</button><button class="b" data-act="dupf">${t('dup')}</button><button class="b dng" data-act="delf">${t('del')}</button></div>`;
 }else if(sel&&sel.t==='stair'){box.innerHTML=`<h3>${t('stair')}</h3><div class="g2"><label class="f">${t('rX')}${num('sx',S.stair.x,.05)}</label><label class="f">${t('rZ')}${num('sz',S.stair.z,.05)}</label></div>`;}
 else box.innerHTML=`<p class="note">${t('iNone')}</p>`;
}
function actRotate(){const f=selFurn();if(!f)return;f.rot=(f.rot+90)%360;queue();}
function actDelFurn(){const f=selFurn();if(!f)return;S.furn=S.furn.filter(q=>q!==f);sel=null;renderInsp();queue();}
$('insp').addEventListener('input',e=>{const el=e.target,k=el.dataset.f;if(!k)return;const r=selRoom(),f=selFurn();
 const val=el.type==='checkbox'?el.checked:el.value,nv=parseFloat(el.value);
 if(sel&&sel.t==='stair'){if(isFinite(nv)){if(k==='sx')S.stair.x=nv;if(k==='sz')S.stair.z=nv;}}
 else if(r){
  if(k.startsWith('op.')){const row=el.closest('.oprow'),o=r.ops[+row.dataset.i],kk=k.slice(3);
   if(kk==='p'){o.p=nv/100;}else if(kk==='w'){if(isFinite(nv))o.w=clamp(nv,.5,6);}
   else if(kk==='k'){o.k=val;delete o.w;delete o.b;delete o.t;renderInsp();}else o.s=val;}
  else if(k==='n'){r.n=val;delete r.nk;}
  else if(['x','z','w','d'].includes(k)){if(isFinite(nv))r[k]=k==='w'||k==='d'?clamp(nv,1.5,20):nv;}
  else if(k==='t'){r.t=val;r.fin=RT[val].fin;r.wall=RT[val].wall;renderInsp();}
  else r[k]=val;}
 else if(f){
  if(k.startsWith('o.')){const kk=k.slice(2);f.o=f.o||{};if(kk==='c'||kk==='chairs')f.o[kk]=val;else if(isFinite(nv))f.o[kk]=nv;}
  else if(isFinite(nv))f[k]=nv;}
 queue();});
$('insp').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,r=selRoom();
 if(a==='rot')actRotate();else if(a==='delf')actDelFurn();
 else if(a==='dupf'){const f=selFurn();if(f){const c=JSON.parse(JSON.stringify(f));c.id='f'+(++FID);c.x+=.4;c.z+=.4;S.furn.push(c);select({t:'furn',id:c.id});queue();}}
 else if(a==='delop'&&r){r.ops.splice(+b.dataset.i,1);renderInsp();queue();}
 else if(a==='addop'&&r){const k=b.dataset.k;r.ops.push(OP(k==='door'?'S':'N',.5,k));renderInsp();queue();}
 else if(a==='delroom'&&r){const lv=roomLv(r.id);S.rooms[lv]=S.rooms[lv].filter(q=>q!==r);sel=null;fitPlan();renderInsp();queue();}
 else if(a==='duproom'&&r){const lv=roomLv(r.id),c=JSON.parse(JSON.stringify(r));c.id='R'+(S.nid++);delete c.nk;c.n=rn(r)+' 2';c.x+=r.w;S.rooms[lv].push(c);fitPlan();select({t:'room',id:c.id});queue();}});
$('addRoom').onclick=()=>{const rs=S.rooms[planLv];let x1=0;rs.forEach(r=>x1=Math.max(x1,r.x+r.w));
 const r=R('R'+(S.nid++),null,'yotoq',x1,0,3.5,3.5,[OP('W',.5,'door'),OP('N',.5,'win')]);r.n=t('newRoom');rs.push(r);fitPlan();select({t:'room',id:r.id});queue();};

/* ---------- panels ---------- */
let tab='plan';
function renderTabs(){document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.p===tab)));
 ['plan','proj','furn','style','data'].forEach(p=>$('p-'+p).hidden=p!==tab);
 if(tab==='plan')sizePlan();renderPanels(true);}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.p;renderTabs();});
function renderPanels(full){if(tab==='proj'&&full)renderProj();else if(tab==='furn')renderFurn();else if(tab==='data')renderData();else if(tab==='style'&&full)renderStyle();}
function renderFurn(){
 const lvIn=planLv===1?[1,3]:[2,4],list=S.furn.filter(f=>lvIn.includes(f.lv));
 $('p-furn').innerHTML=`<p class="eyebrow">${t('fCat')}</p><div class="cat">${CAT.map(c=>`<button class="b" data-add="${c[0]}">${t('c_'+c[0])}</button>`).join('')}</div>
 <div class="row"><div class="seg" id="furnSeg"><button data-v="1" aria-pressed="${planLv===1}">${t('lv1')}</button><button data-v="2" aria-pressed="${planLv===2}">${t('lv2')}</button></div></div>
 <p class="eyebrow">${t('fList')}</p><div class="list">${list.length?list.map(f=>{const c=CAT.find(q=>q[1]===f.k);return `<button data-sel="${f.id}" class="${sel&&sel.id===f.id?'on':''}"><span>${esc(c?t('c_'+c[0]):f.k)}</span><span>${fmt(f.x,1)}; ${fmt(f.z,1)}</span></button>`;}).join(''):`<p class="note">${t('fNone')}</p>`}</div>`;
}
$('p-furn').addEventListener('click',e=>{const a=e.target.closest('[data-add]'),s=e.target.closest('[data-sel]'),sg=e.target.closest('#furnSeg button');
 if(sg){setPlanLv(+sg.dataset.v);renderFurn();return;}
 if(s){select({t:'furn',id:s.dataset.sel});return;}
 if(!a)return;const c=CAT.find(q=>q[0]===a.dataset.add);let x,z,lv;
 if(walk.on){x=snap(walk.x-Math.sin(walk.yaw)*1.4,.05);z=snap(walk.z-Math.cos(walk.yaw)*1.4,.05);lv=walk.y>upperY()?2:1;}
 else{const r=selRoom()||S.rooms[planLv][0];if(!r)return;x=r.x+r.w/2;z=r.z+r.d/2;lv=roomLv(r.id);}
 const f={id:'f'+(++FID),k:c[1],x,z,rot:0,lv,o:JSON.parse(JSON.stringify(c[2]))};S.furn.push(f);autoLv(f);select({t:'furn',id:f.id});queue();toast(t(walk.on?'fWalkAdd':'fAdded'));});
function setPlanLv(lv){planLv=lv;press('planSeg',String(lv));drawPlan();renderPanels();}
$('planSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setPlanLv(+b.dataset.v);});

 const fac=(n,k)=>`<div class="sgrp"><p class="eyebrow">${t(n)}</p><div class="g2"><label class="f">${t('sFac1').slice(0,0)}<select data-s="${k}p">${optList(PRESETS,st[k].p,v=>t('fp_'+v))}</select></label><label class="f">${t('sTint')}<input type="color" data-s="${k}c" value="${st[k].c}"></label></div></div>`;
 const col=(k,lab,v)=>`<label class="f">${t(lab)}<input type="color" data-s="${k}" value="${v}"></label>`;

 <div class="g2"><label class="f">${t('sRoof')}<select data-s="roof">${optList(['hip','gable','flat','none'],st.roof,v=>t('roof_'+v))}</select></label>${col('roofC','sRoofC',st.roofC)}</div>
 <label class="f">${t('sAngle')}: <b id="angV">${st.roofAng}</b><input type="range" data-s="roofAng" min="10" max="45" step="1" value="${st.roofAng}"></label>
 <div class="g2">${col('trim','sTrim',st.trim)}${col('frame','sFrame',st.frame)}</div></div>
 <div class="sgrp"><p class="eyebrow">${t('sInt')}</p><div class="g2">${col('int','sInt',st.int)}<button class="b" data-act="applyInt" style="align-self:end">${t('sApply')}</button></div>

 <div class="g2">${col('plinthC','sPlinthC',st.plinthC)}${col('surrC','sSurr',st.surrC)}</div>
 ${['surr','sconces','led','tiles','portico','chimney','lawn'].map(k=>`<label class="chk"><input type="checkbox" data-st="${k}"${st[k]?' checked':''}>${t({surr:'sSurr',sconces:'sSconce',led:'sLed',tiles:'sTiles',portico:'sPortico',chimney:'sChimney',lawn:'sLawn'}[k])}</label>`).join('')}</div>
 <div class="sgrp"><p class="eyebrow">${t('sPlot')}</p>${chk('ayvon')}${chk('fence')}${chk('trees')}${chk('ishkom')}${col('fenceC','sFence',st.fenceC)}</div>
 <button class="b dng" id="resetBtn" style="align-self:flex-start">${t('sReset')}</button>`;
}
$('p-style').addEventListener('input',e=>{const el=e.target,k=el.dataset.s,ok=el.dataset.o,st=S.style;
 if(el.dataset.st){st[el.dataset.st]=el.checked;if(el.dataset.st==='lawn')buildLand();queue();return;}
 if(k==='plinthH'){st.plinthH=parseFloat(el.value);const v=$('plV');if(v)v.textContent=fmt(st.plinthH);queue();return;}
 if(ok){S.opt[ok]=el.checked;buildLand();fitPlan();queue();return;}if(!k)return;
 if(k==='f1p'||k==='f2p'){const f=k.slice(0,2);st[f].p=el.value;st[f].c=PRESET_C[el.value];const ci=document.querySelector(`[data-s="${f}c"]`);if(ci)ci.value=st[f].c;}
 else if(k==='f1c'||k==='f2c')st[k.slice(0,2)].c=el.value;
 else if(k==='roofAng'||k==='storey'){st[k]=parseFloat(el.value);const v=$(k==='storey'?'stV':'angV');if(v)v.textContent=k==='storey'?fmt(st[k]):st[k];}
 else{st[k]=el.value;if(k==='fenceC')buildLand();}
 queue();});
$('p-style').addEventListener('click',e=>{
 if(e.target.dataset.act==='applyInt'){allRooms().forEach(r=>r.wall=S.style.int);queue();}
 if(e.target.id==='resetBtn'){const b=e.target;if(b.dataset.sure){S=defaultState();hist(true);sel=null;fitPlan();buildLand();renderInsp();renderStyle();queue();}else{b.dataset.sure=1;b.textContent=t('sSure');setTimeout(()=>{b.dataset.sure='';b.textContent=t('sReset');},3000);}}});

function totals(){const gross=allRooms().reduce((a,r)=>a+r.w*r.d,0),liv=allRooms().filter(r=>['yotoq','mehmon'].includes(r.t)).reduce((a,r)=>a+r.w*r.d,0);
 const W=BB1.x1-BB1.x0,ext=S.opt.ayvon?W*3*2:0;return {gross,liv,beds:allRooms().filter(r=>r.t==='yotoq').length,baths:allRooms().filter(r=>r.t==='hammom').length,cost:(gross+.5*ext)*S.price};}
function ridgeH(){const H=S.style.storey,bw=BB2.x1-BB2.x0,bd=BB2.z1-BB2.z0,hv=(Math.min(bw,bd)+1.4)/2;return BASE1+2*H+(S.style.roof==='none'?0:S.style.roof==='flat'?.25:hv*Math.tan(S.style.roofAng*Math.PI/180));}
function renderKPIs(){const T=totals();$('kpis').innerHTML=[[fmt(T.gross,0),t('m2'),t('kTot')],[fmt(T.liv,1),t('m2'),t('kLiv')],[T.beds,'',t('kBed')],[T.baths,'',t('kBath')],
 [fmt(ridgeH(),1),t('m'),t('kRidge')],[fmt(BB1.x1-BB1.x0,0)+' × '+fmt(BB1.z1-BB1.z0+(S.opt.ayvon?3:0),0),t('m'),t('kFoot')]]
 .map(([v,u,k])=>`<div class="kpi"><div class="v">${v} <small>${u}</small></div><div class="k">${k}</div></div>`).join('');}
const COST=[['cFound',.12],['cWalls',.28],['cRoof',.09],['cFacade',.1],['cWin',.08],['cEng',.13],['cFin',.2]];

 `<tr class="sum"><td>${t('dTotal')} ${t('lv'+lv)}</td><td class="a">${fmt(S.rooms[lv].reduce((a,r)=>a+r.w*r.d,0),2)}</td></tr>`;
 const T=totals();
 $('p-data').innerHTML=`<p class="eyebrow">${t('dExpl')}</p><table><thead><tr><th>${t('rName')}</th><th class="a">${t('m2')}</th></tr></thead><tbody>${rows(1)}${rows(2)}</tbody></table>
 <p class="eyebrow">${t('dSpec')}</p><p class="note">${t('spec1')}</p><p class="note">${t('spec2')}</p><p class="note">${t('spec3')}</p>
 ${boqHTML()}<p class="eyebrow">${t('dCost')}</p><label class="f">${t('cPrice')}<input type="number" id="price" value="${S.price}" min="0" step="10"></label>

 <div class="bars">${COST.map(([n,f])=>`<div class="brow"><span>${t(n)}</span><span>$${fmt(T.cost*f,0)}</span><div class="tr"><div class="fl" style="width:${f/.28*100}%"></div></div></div>`).join('')}</div>
 <p class="note">${t('cNote')}</p><div class="row"><button class="b" id="expBtn">${t('eCopy')}</button><button class="b" id="impBtn">${t('eLoad')}</button></div><textarea id="jsonTx" hidden></textarea>`;

$('p-data').addEventListener('click',e=>{const tr=e.target.closest('tr[data-r]');if(tr){select({t:'room',id:tr.dataset.r});return;}
 const ta=$('jsonTx');
 if(e.target.id==='expBtn'){const txt=JSON.stringify(S);try{navigator.clipboard.writeText(txt).then(()=>toast(t('eOk')),()=>{ta.hidden=false;ta.value=txt;ta.select();});}catch(_){ta.hidden=false;ta.value=txt;ta.select();}}
 if(e.target.id==='impBtn'){if(ta.hidden){ta.hidden=false;ta.value='';ta.focus();return;}
  try{const d=JSON.parse(ta.value);if(!d.rooms||!d.rooms[1]||!d.rooms[2]||!Array.isArray(d.furn))throw 0;d.style=Object.assign({},defaultState().style,STYLE_NEUTRAL,d.style);d.opt=Object.assign(defaultState().opt,d.opt);d.stair=d.stair||{x:-999,z:-999};
   FID=d.furn.reduce((m,f)=>Math.max(m,parseInt(String(f.id).slice(1))||0),0);S=d;sel=null;fitPlan();buildLand();renderInsp();queue();ta.hidden=true;toast(t('eLoaded'));}catch(_){toast(t('eBad'));}}});

/* ---------- lang, theme, modes ---------- */
function renderWalkbar(){$('walkbar').innerHTML=[['door','spDoor'],['living','spLiving'],['upper','spUpper'],['ayvon','spAyvon']].filter(([k])=>(k!=='upper'||nSt()===2)&&(k!=='ayvon'||S.opt.ayvon)).map(([k,l])=>`<button data-sp="${k}">${t(l)}</button>`).join('')+`<button data-act="lock">${t('wLock')}</button><button data-act="exit">${t('wExit')}</button>`;}
$('walkbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.sp){const sp=spawnPoint(b.dataset.sp);Object.assign(walk,{x:sp.x,z:sp.z,y:sp.y,yaw:sp.yaw,pitch:0});}
 else if(b.dataset.act==='exit')exitWalk();else{try{dom.requestPointerLock();}catch(_){}}});
function applyLang(){document.documentElement.lang=LANG;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 press('langSeg',LANG);$('hint').textContent=walk.on?t('hintW'):t('hintO');$('panelBtn').textContent=t(document.body.classList.contains('nopanel')?'pShow':'pHide');
 renderWalkbar();adaptLevels();renderInsp();renderKPIs();renderPanels(true);drawPlan();}
$('langSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;LANG=b.dataset.v;lsSet('nv-lang',LANG);applyLang();});
$('panelBtn').onclick=()=>{document.body.classList.toggle('nopanel');applyLang();resize();};
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{if(b.dataset.v==='walk')enterWalk('door');else exitWalk();});
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>{curView=b.dataset.v;press('viewSeg',curView);goView(curView);});
document.querySelectorAll('#levelSeg button').forEach(b=>b.onclick=()=>{level=b.dataset.v;press('levelSeg',level);buildHouse();updateOverlays();
 if(level!=='all'){goView('lv'+level);press('viewSeg','');setPlanLv(+level);}else{goView(curView);press('viewSeg',curView);}});
$('sunT').addEventListener('input',e=>setSun(+e.target.value));
$('lightChk').addEventListener('change',e=>{S.opt.lights=e.target.checked;save();});
function applyTheme(){themeCols();skyApply();drawPlan();updateOverlays();}
function resize(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(host);new ResizeObserver(()=>sizePlan()).observe(plan.parentElement);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
let last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(anim){const k=Math.min(1,(now-anim.t0)/anim.dur),e=ease(k);camera.position.lerpVectors(anim.fp,anim.to.p,e);controls.target.lerpVectors(anim.ft,anim.to.t,e);if(k>=1)anim=null;}
 if(walk.on)walkUpdate(dt);else controls.update();
 updateLights();if(boxH)boxH.update();renderer.render(scene,camera);requestAnimationFrame(loop);})(performance.now());

/* ---------- init ---------- */
computeGeom();buildLand();themeCols();$('lightChk').checked=S.opt.lights;
fitPlan();setSun(17);press('viewSeg','street');press('levelSeg','all');press('modeSeg','orbit');press('planSeg','1');
buildHouse();applyLang();resize();curView='street';goView('street',true);applyTheme();renderTabs();initExtras();
if(document.fonts)document.fonts.ready.then(drawPlan);
</script>
